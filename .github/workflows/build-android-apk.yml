name: Build Android APK

on:
  push:
    branches:
      - apk-build
    paths:
      - 'android-wrapper/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p android-wrapper :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp android-wrapper/app/build/outputs/apk/debug/app-debug.apk artifacts/Arduino-Science-Workbench.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arduino-Science-Workbench-APK
          path: artifacts/Arduino-Science-Workbench.apk
          if-no-files-found: error
